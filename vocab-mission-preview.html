<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vocab Mission · local prototype</title>
<style>:root{--bg:#f4f6fa;--surface:#fff;--ink:#1c2434;--muted:#526078;--line:#c2cbd9;--accent:#315fd5;--font:'Be Vietnam Pro',system-ui,sans-serif;--mono:monospace}:root[data-theme="dark"]{--bg:#12141f;--surface:#1c2030;--ink:#edf1fa;--muted:#b5bfd4;--line:#505b73;--accent:#9ab9ff}body{margin:0;font:16px/1.6 system-ui;background:var(--bg);color:var(--ink)}.tools{box-sizing:border-box;max-width:820px;margin:auto;padding:14px 20px;font-size:.75rem;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}.tools select,.tools button{font:inherit;min-height:44px;padding:8px;border:1px solid var(--muted);border-radius:8px;background:var(--surface);color:var(--ink)}.tools label{display:flex;align-items:center;gap:6px;min-height:44px}.tools a{color:var(--accent)}.tools :focus-visible{outline:3px solid var(--accent);outline-offset:3px}</style><link rel="stylesheet" href="vocab-mission.css"></head><body>
<aside class="tools" aria-label="Local preview utilities"><span>Local demo · browser storage only</span><select id="mission" aria-label="Scenario"><option value="p1-town-on-the-move">Town on the Move · P1-linked</option><option value="authored-save-the-coast">Save the Coast · authored demo</option></select><select id="identity" aria-label="Demo identity"><option value="a">Tester A</option><option value="b">Tester B</option></select><button id="theme" type="button">Switch theme</button><label><input id="fixture" type="checkbox">Use labelled QA profile (P1 only)</label><a href="vocab-lab-preview.html">Vocab Check</a></aside><main id="missionHost" class="vm"></main>
<script src="vocab-mission-content.js"></script><script src="vocab-mission-core.js"></script><script src="vocab-mission.js"></script><script>
(function(){var params=new URLSearchParams(location.search);if(params.get('mission')==='authored-save-the-coast')document.getElementById('mission').value='authored-save-the-coast';document.getElementById('fixture').checked=params.get('profile')==='qa';if(params.get('account')==='b')document.getElementById('identity').value='b';if(params.get('theme')==='dark')document.documentElement.setAttribute('data-theme','dark');function start(){var coast=document.getElementById('mission').value==='authored-save-the-coast';document.getElementById('fixture').disabled=coast;if(coast)document.getElementById('fixture').checked=false;window.MD_MISSION.open(document.getElementById('missionHost'),{user:{email:'sandbox-'+document.getElementById('identity').value+'@local.invalid',role:'student',tester:true},demo:true,missionId:document.getElementById('mission').value,sampleProfile:document.getElementById('fixture').checked})}['mission','identity','fixture'].forEach(function(id){document.getElementById(id).addEventListener('change',start)});document.getElementById('theme').addEventListener('click',function(){document.documentElement.setAttribute('data-theme',document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark')});start()})();
</script></body></html>
