<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vocab Lab · local sandbox</title>
<style>
:root{--bg:#f4f6fa;--surface:#fff;--ink:#1c2434;--muted:#526078;--line:#c2cbd9;--accent:#315fd5;--font:'Be Vietnam Pro',system-ui,sans-serif;--mono:monospace}
:root[data-theme="dark"]{--bg:#12141f;--surface:#1c2030;--ink:#edf1fa;--muted:#b5bfd4;--line:#505b73;--accent:#9ab9ff}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font)}.sandbox{max-width:780px;margin:auto;padding:12px 20px 0;line-height:1.6;box-sizing:border-box;font-size:.75rem;color:var(--muted)}.sandbox-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:10px}.sandbox-controls{display:flex;align-items:center;gap:8px}.sandbox select,.sandbox button{font:inherit;min-height:44px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:7px 10px}.sandbox summary{cursor:pointer;min-height:44px;display:flex;align-items:center}.sandbox details p{max-width:600px;margin:0 0 8px}.sandbox :focus-visible{outline:3px solid var(--accent);outline-offset:3px}.btn{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 16px;cursor:pointer}.btn.pri{background:var(--accent);color:var(--surface)}.meta{color:var(--muted)}@media(max-width:640px){.sandbox{padding:8px 14px 0}.sandbox-bar{gap:6px}.sandbox-controls{gap:5px}.sandbox select,.sandbox button{padding:7px;font-size:.7rem}.sandbox-label{max-width:90px}}
</style><link rel="stylesheet" href="vocab-lab.css"></head>
<body><aside class="sandbox" aria-label="Preview utilities"><div class="sandbox-bar"><span class="sandbox-label">Preview · this browser only</span><div class="sandbox-controls"><select id="sandboxUser" aria-label="Preview account"><option value="a">Tester A</option><option value="b">Tester B</option></select><button type="button" id="theme">Switch theme</button></div></div><details><summary>About this preview</summary><p>102 approved Passage 1 entries. These are separate preview accounts; progress stays in this browser. No real account or Firebase writes. Runs on localhost only.</p></details></aside><main id="preview" class="vl"></main>
<link rel="stylesheet" href="vocab-mission.css"><script src="vocab-mission-content.js"></script><script src="vocab-mission-core.js"></script><script src="vocab-mission.js"></script>
<script src="vocab-lab-core.js"></script><script src="vocab-lab-store.js"></script><script src="vocab-lab.js"></script>
<script>
(function(){
  var host=location.hostname;
  if(['localhost','127.0.0.1','[::1]'].indexOf(host)<0){document.getElementById('preview').textContent='Sandbox runs on localhost only.';return}
  function start(){window.MD_VOCAB.mount(document.getElementById('preview'),{demo:true,user:{email:'sandbox-'+document.getElementById('sandboxUser').value+'@local.invalid',role:'student',tester:true}})}
  document.getElementById('sandboxUser').addEventListener('change',start);
  document.getElementById('theme').addEventListener('click',function(){document.documentElement.setAttribute('data-theme',document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark')});start();
})();
</script></body></html>
